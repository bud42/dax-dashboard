name: Build Windows exe
on:
  push:
    branches:
      - v2
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install .
          pip uninstall pathlib -y
          pip install pyinstaller
      - name: Verify pywebview
        run: python -c "import webview; print(webview.__file__)"
      - name: Build exe
        run: >-
          pyinstaller launcher.py
          --console
          --onedir
          --windowed
          --collect-all dash_bootstrap_templates
          --collect-all daxdashboard
          --collect-all dash_ag_grid
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/
